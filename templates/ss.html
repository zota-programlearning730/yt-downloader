<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 下載器 (Python + JS)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background-color: #28a745; color: white; border: none; }
        button:disabled { background-color: #ccc; }
        #status { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>YouTube 下載器</h1>
    
    <div class="input-group">
        <label>影片或播放清單網址：</label>
        <input type="text" id="urlInput" placeholder="請貼上 YouTube 網址...">
    </div>

    <div class="input-group">
        <label>
            <input type="checkbox" id="lyricsCheckbox"> 下載歌詞 (字幕檔)
        </label>
    </div>

    <button id="downloadBtn" onclick="startDownload()">開始下載</button>
    
    <div id="status"></div>

    <script>
        async function startDownload() {
            const url = document.getElementById('urlInput').value;
            const lyrics = document.getElementById('lyricsCheckbox').checked;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');

            if (!url) {
                alert('請輸入網址！');
                return;
            }

            // 鎖定按鈕避免重複點擊
            btn.disabled = true;
            btn.innerText = "下載進行中...";
            statusDiv.innerText = "正在處理中，請稍候... (若為播放清單需要較長時間)";

            try {
                // 發送請求給 Python 後端
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, lyrics: lyrics })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    statusDiv.innerText = "✅ " + data.message;
                } else {
                    statusDiv.innerText = "❌ " + data.message;
                }
            } catch (error) {
                statusDiv.innerText = "❌ 系統錯誤: " + error;
            } finally {
                // 恢復按鈕
                btn.disabled = false;
                btn.innerText = "開始下載";
            }
        }
    </script>
</body>
</html>
