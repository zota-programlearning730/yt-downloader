<script>
    async function startDownload() {
        const url = document.getElementById('urlInput').value;
        const lyrics = document.getElementById('lyricsCheckbox').checked;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');

        if (!url) { alert('請輸入網址！'); return; }

        btn.disabled = true;
        btn.innerText = "伺服器處理中...";
        statusDiv.innerText = "伺服器正在下載與轉檔，請稍候... (長度越長越久)";

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, lyrics: lyrics })
            });

            const data = await response.json();

            if (data.status === 'success') {
                statusDiv.innerText = "✅ 處理完成！下載即將開始...";
                // 這裡最重要：收到下載連結後，讓瀏覽器跳轉去下載
                window.location.href = data.download_url;
            } else {
                statusDiv.innerText = "❌ " + data.message;
            }
        } catch (error) {
            statusDiv.innerText = "❌ 系統錯誤: " + error;
        } finally {
            btn.disabled = false;
            btn.innerText = "開始下載";
        }
    }
</script>
