<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 下載器 (Python + JS)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { 
            margin-bottom: 20px; 
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button { 
            width: 100%;
            padding: 15px; 
            cursor: pointer; 
            background-color: #3498db; 
            color: white; 
            border: none; 
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled { 
            background-color: #95a5a6; 
            cursor: not-allowed;
        }
        #status { 
            margin-top: 20px; 
            white-space: pre-wrap; 
            padding: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube 音樂下載器</h1>
        
        <div class="input-group">
            <label for="urlInput">影片或播放清單網址：</label>
            <input type="text" id="urlInput" placeholder="請貼上 https://www.youtube.com/...">
        </div>

        <div class="input-group">
            <label style="font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="lyricsCheckbox"> 同時下載歌詞 (如有提供)
            </label>
        </div>

        <button id="downloadBtn" onclick="startDownload()">開始下載</button>
        
        <div id="status">準備就緒...</div>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('urlInput').value;
            const lyrics = document.getElementById('lyricsCheckbox').checked;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');

            // 簡單的網址檢查
            if (!url) {
                alert('請輸入網址！');
                return;
            }

            // 鎖定按鈕，避免重複點擊
            btn.disabled = true;
            btn.innerText = "伺服器處理中...";
            statusDiv.innerText = "正在伺服器端下載與轉檔...\n(如果是播放清單，可能需要幾分鐘，請耐心等候)";
            statusDiv.style.color = "#d35400"; // 橘色文字表示處理中

            try {
                // 1. 發送請求給 Python 後端
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, lyrics: lyrics })
                });

                const data = await response.json();

                // 2. 判斷後端回應
                if (data.status === 'success') {
                    statusDiv.innerText = "✅ 處理完成！瀏覽器將開始下載檔案...";
                    statusDiv.style.color = "#27ae60"; // 綠色
                    
                    // 3. 這是最關鍵的一步：讓瀏覽器跳轉到下載連結
                    // 這會觸發 Python 的 /get-file 路由，瀏覽器就會跳出存檔視窗
                    window.location.href = data.download_url;
                    
                    // 下載啟動後，恢復按鈕文字
                    setTimeout(() => {
                        btn.innerText = "下載完成，再來一首？";
                        btn.disabled = false;
                    }, 2000);

                } else {
                    // 後端回傳錯誤 (例如網址無效)
                    statusDiv.innerText = "❌ 錯誤: " + data.message;
                    statusDiv.style.color = "#c0392b"; // 紅色
                    btn.disabled = false;
                    btn.innerText = "開始下載";
                }
            } catch (error) {
                // 網路連線錯誤或其他例外
                statusDiv.innerText = "❌ 系統錯誤: " + error;
                statusDiv.style.color = "#c0392b";
                btn.disabled = false;
                btn.innerText = "開始下載";
            }
        }
    </script>
</body>
</html>
